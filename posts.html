<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Posts</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body class="bg-light">

    <div class="container py-5">

        <!-- Title -->
        <div class="text-center mb-5">

            <h1 class="fw-bold">
                <i class="fa-solid fa-newspaper text-primary"></i>
                All Posts
            </h1>

            <p class="text-secondary">
                Posts from JSONPlaceholder
            </p>

        </div>


        <!-- Posts will appear here -->
        <div id="posts" class="row g-4"></div>

    </div>


    <script>

        // Get the div where we want to show the posts
        let posts = document.getElementById("posts");


        // Get the posts from the API
        fetch("https://jsonplaceholder.typicode.com/posts")

            .then(response => response.json())

            .then(data => {

                // Go through every post
                data.forEach(post => {

                    // Create a column
                    let col = document.createElement("div");

                    col.className = "col-12 col-md-6 col-lg-4";


                    // Create the card
                    col.innerHTML = `

                        <div class="card h-100 border-0 shadow-sm rounded-4">

                            <div class="card-body p-4">

                                <div class="d-flex justify-content-between mb-3">

                                    <span class="badge bg-primary rounded-pill">
                                        Post #${post.id}
                                    </span>

                                    <span class="text-secondary">
                                        <i class="fa-solid fa-user"></i>
                                        User ${post.userId}
                                    </span>

                                </div>


                                <h5 class="card-title fw-bold text-capitalize">
                                    ${post.title}
                                </h5>


                                <p class="card-text text-secondary">
                                    ${post.body}
                                </p>


                                <button class="btn btn-outline-primary btn-sm">

                                    Read more

                                    <i class="fa-solid fa-arrow-right ms-1"></i>

                                </button>

                            </div>

                        </div>

                    `;


                    // Put the card inside the posts div
                    posts.appendChild(col);

                });

            })

            .catch(error => {

                console.log(error);

            });

    </script>

</body>

</html>
